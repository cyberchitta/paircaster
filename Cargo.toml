[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/cyberchitta/selfcast"
rust-version = "1.85"

[workspace.dependencies]
selfcast-core = { path = "crates/core", version = "0.0.1" }
alloy-primitives = { version = "1", default-features = false, features = ["std"] }
alloy-sol-types = { version = "1", default-features = false, features = ["std"] }
base64 = "0.22"
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "std"] }
bip39 = { version = "2", default-features = false, features = ["std", "zeroize"] }
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
flate2 = "1"
getrandom = "0.4"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["fs", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
zeroize = "1"
