[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/cyberchitta/paircaster"
rust-version = "1.99.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
too_many_lines = "deny"

[workspace.dependencies]
paircaster-core = { path = "crates/core", version = "0.0.1" }
alloy-primitives = { version = "1", default-features = false, features = ["std"] }
alloy-sol-types = { version = "1", default-features = false, features = ["std"] }
base64 = "0.22"
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "std"] }
bip39 = { version = "2", default-features = false, features = ["std", "zeroize"] }
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2 = "1"
getrandom = "0.4"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["fs", "process", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "time"] }
zeroize = "1"
pair-ui = { git = "https://github.com/cyberchitta/pair-ui.git", rev = "0c4873e61cccddc146dd1f531afe1d1799c354ff" }

# The viewer's WebAssembly, built by viewer/build.ts: small over fast.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
