[package]
name = "selfcast-core"
description = "Higher-level Farcaster API over your own Snapchain node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
base64.workspace = true
bip32.workspace = true
bip39.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
hex.workspace = true
k256.workspace = true
prost.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
alloy-dyn-abi = { version = "1", features = ["eip712"] }
alloy-primitives = { workspace = true, features = ["k256"] }

[lints]
workspace = true

# Only for the viewer page: the key code pulls in getrandom 0.2, which needs
# its browser source of randomness to build for WebAssembly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
