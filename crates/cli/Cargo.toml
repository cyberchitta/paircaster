[package]
name = "paircaster"
description = "Farcaster from your own Snapchain node, for humans and agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "paircaster"
path = "src/main.rs"

[features]
# Compiles the viewer page (viewer/dist, built by `bun build.ts` in viewer/)
# into the binary, for `paircaster viewer serve`. Release builds turn it on.
viewer = []

[dependencies]
paircaster-core.workspace = true
pair-ui.workspace = true
clap.workspace = true
flate2.workspace = true
getrandom.workspace = true
hex.workspace = true
prost.workspace = true
reqwest.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[lints]
workspace = true
